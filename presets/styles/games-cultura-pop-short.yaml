id: games-cultura-pop-short
name: "Games e Cultura Pop (Short)"
description: "Notícias e curiosidades de games, filmes e séries em 9:16: key art e 3D coloridos, números na tela, cortes ágeis e trilha animada."
family: motion_graphics
families_mix: [motion_graphics, still_cinema]
structure: none
tags: [games, noticias, cultura-pop, shorts]

format:
  type: short
  aspect: "9:16"
  resolution: 1080x1920
  fps: 30
  duration: { target_s: 50, min_s: 35, max_s: 59 }

languages:
  primary: pt-BR
  outputs: [pt-BR]
  delivery: separate_videos

script:
  tone: "notícia e curiosidade de games: direto, datas e números ditos com clareza, sem suspense artificial"
  structure: [hook_noticia, contexto, numeros, detalhe, cta_loop]
  hook_max_s: 3
  fact_check: true
  cta: "Siga para mais novidades de games."
  banned_phrases: ["neste vídeo", "não esqueça de se inscrever", "vazou", "vazamento"]

# Sem `chain`: usa a cadeia de voz padrão do app.
voice:
  voice: Laomedeia
  style_prompt: "Narre como apresentador de notícias de games: energia, clareza nos números e nas datas, ritmo ágil."
  speed: 1.05
  gap_s: 0.15

art:
  # Só o tratamento de referência: o assunto de cada vídeo define o mundo das imagens.
  bible: "cores saturadas de pôr do sol e neon, contraste limpo, luz de fim de tarde, sem grão"
  banned: ["texto", "letras", "logotipos", "marca d'água", "interface de jogo"]
  languages: [key_art, render_3d, ui_mockup, editorial]
  image_chain: [codex_cli]

edit:
  shot_seconds: { min: 1.8, max: 3.0 }
  new_image_ratio: 0.5
  camera: { ken_burns_in: 3, punch_zoom: 2, pan_left: 1, pan_right: 1, pan_up: 1, drift: 1 }
  transitions: { cut: 6, zoom_blur: 2, flash: 1, glitch: 1 }
  transition_seconds: 0.3
  # Imagem limpa: sem poeira nem grão.
  effects:
    - { type: grade, preset: vivid, amount: 0.35 }
    - { type: vignette, amount: 0.12 }
  captions:
    style: karaoke
    font: Montserrat
    weight: 900
    size: 82
    color: "#FFFFFF"
    highlight: "#FFD400"
    stroke: 8
    position: center
    max_words_per_line: 3
    uppercase: true
  text_cards:
    font: Anton
    color: "#FFFFFF"
    accent: "#FF2E88"
    background: "#140B33"
    animation: pop
  progress_bar: true
  progress_color: "#FF2E88"
  zoom_strength: 0.12

audio:
  music: { source: procedural, mood: upbeat, volume_db: -24, ducking: true }
  sfx: { auto: true, pack: basic, volume_db: -13 }
  loudness_lufs: -14

thumbnail: { template: sem-texto, variations: 1, per_language: false }

publish:
  targets:
    - { platform: youtube, driver: youtube_native, privacy: public }
    - { platform: tiktok, driver: buffer }
    - { platform: instagram, driver: buffer }
  ai_label: auto
