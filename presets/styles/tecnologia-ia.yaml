id: tecnologia-ia
name: "Tecnologia e IA (Short)"
description: "Novidades e explicações de tecnologia em 9:16: 3D limpo e claro em azul e ciano, cortes rápidos e trilha animada."
family: motion_graphics
families_mix: [motion_graphics, still_cinema]
structure: none
tags: [tecnologia, ia, ciencia, shorts]

format:
  type: short
  aspect: "9:16"
  resolution: 1080x1920
  fps: 30
  duration: { target_s: 50, min_s: 35, max_s: 59 }

languages:
  primary: pt-BR
  outputs: [pt-BR]
  delivery: separate_videos

script:
  tone: "objetivo e atual: explica a novidade ou o conceito em linguagem simples, diz por que importa e o que muda na vida real, sem exagero nem alarmismo"
  structure: [hook_novidade, o_que_e, como_funciona, por_que_importa, cta_loop]
  hook_max_s: 3
  fact_check: true
  cta: "Siga para entender a tecnologia sem complicação."
  banned_phrases: ["neste vídeo", "não esqueça de se inscrever"]

# Sem `chain`: usa a cadeia de voz padrão do app.
voice:
  voice: Iapetus
  style_prompt: "Narre com clareza e energia, tom moderno e direto, ritmo ágil."
  speed: 1.05
  gap_s: 0.15

art:
  bible: "render 3D limpo e moderno, dispositivos, chips, robôs simpáticos e interfaces abstratas sem texto, paleta azul elétrico, ciano e branco, fundo claro com gradiente suave, luz de estúdio"
  banned: ["texto", "letras", "números", "logotipos", "marca d'água", "marcas reais"]
  image_chain: [codex_cli]

edit:
  shot_seconds: { min: 1.8, max: 3.0 }
  camera: { ken_burns_in: 3, punch_zoom: 2, pan_left: 1, pan_right: 1, drift: 1 }
  transitions: { cut: 6, zoom_blur: 2, glitch: 1, flash: 1 }
  transition_seconds: 0.3
  effects:
    - { type: grade, preset: clean-cool, amount: 0.45 }
    - { type: vignette, amount: 0.15 }
  captions:
    style: karaoke
    font: Montserrat
    weight: 900
    size: 80
    color: "#FFFFFF"
    highlight: "#38BDF8"
    stroke: 8
    position: center
    max_words_per_line: 3
    uppercase: true
  text_cards:
    font: "IBM Plex Sans"
    color: "#FFFFFF"
    accent: "#38BDF8"
    background: "#0B2545"
    animation: pop
  progress_bar: true
  progress_color: "#38BDF8"
  zoom_strength: 0.12

audio:
  music: { source: procedural, mood: upbeat, volume_db: -25, ducking: true }
  sfx: { auto: true, pack: basic, volume_db: -13 }
  loudness_lufs: -14

thumbnail: { template: sem-texto, variations: 1, per_language: false }

publish:
  targets:
    - { platform: youtube, driver: youtube_native, privacy: public }
    - { platform: tiktok, driver: buffer }
    - { platform: instagram, driver: buffer }
  ai_label: auto
