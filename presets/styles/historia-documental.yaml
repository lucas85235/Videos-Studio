id: historia-documental
name: "História Documental (longo)"
description: "História em 16:9 com pinturas digitais luminosas da época, Ken Burns, cartões de capítulo e trilha leve, sem clima de terror."
family: still_cinema
families_mix: [still_cinema, motion_graphics]
structure: none
tags: [historia, documentario, cultura, longo]

format:
  type: long
  aspect: "16:9"
  resolution: 1920x1080
  fps: 30
  duration: { target_s: 780, min_s: 540, max_s: 1200 }

languages:
  primary: pt-BR
  outputs: [pt-BR]
  delivery: separate_videos

script:
  tone: "documental e envolvente: fatos verificáveis com datas e lugares, contexto da época, a vida das pessoas comuns, curiosidades e um gancho a cada capítulo, sem sensacionalismo"
  structure: [hook, contexto, capitulo_1, capitulo_2, capitulo_3, capitulo_4, legado, conclusao, cta]
  hook_max_s: 15
  fact_check: true
  cta: "Inscreva-se para viajar por mais capítulos da história."

# Sem `chain`: usa a cadeia de voz padrão do app.
voice:
  voice: Sadaltager
  style_prompt: "Narre como um documentário de história: voz experiente e acolhedora, ritmo calmo, pausas nas datas importantes."
  speed: 0.98
  gap_s: 0.45

art:
  bible: "pintura digital histórica realista e luminosa, cores naturais da época, luz do dia suave, cenas amplas de cidades, mercados, paisagens e pessoas comuns, figurinos e arquitetura fiéis ao período"
  banned: ["texto", "letras", "logotipos", "marca d'água", "violência explícita", "objetos modernos fora da época"]
  languages: [archival, painting, isometric]
  image_chain: [codex_cli]

edit:
  shot_seconds: { min: 4.0, max: 6.5 }
  camera: { ken_burns_in: 4, ken_burns_out: 3, pan_left: 2, pan_right: 2, pan_up: 1, drift: 1 }
  transitions: { cut: 6, fade_black: 1, light_leak: 2 }
  transition_seconds: 0.6
  effects:
    - { type: grade, preset: warm-soft, amount: 0.45 }
    - { type: grain, amount: 0.12 }
    - { type: vignette, amount: 0.2 }
  captions:
    style: line
    font: Montserrat
    weight: 700
    size: 46
    color: "#FFFFFF"
    highlight: "#F2B544"
    stroke: 4
    position: bottom
    max_words_per_line: 8
    uppercase: false
  text_cards:
    font: Cinzel
    color: "#FFF8EC"
    accent: "#F2B544"
    background: "#3B2A1A"
    animation: fade_up
  progress_bar: false
  zoom_strength: 0.08

audio:
  music: { source: procedural, mood: neutral, volume_db: -25, ducking: true }
  sfx: { auto: true, pack: basic, volume_db: -15 }
  loudness_lufs: -14

thumbnail: { template: texto-grande-esquerda, variations: 3, per_language: true, font: "Bebas Neue", accent: "#F2B544" }

publish:
  targets:
    - { platform: youtube, driver: youtube_native, privacy: private }
  ai_label: auto
