id: estoico-short
name: "Estoico / Motivacional (Short)"
description: "Reflexões curtas em 9:16 com pinturas clássicas, tipografia cinética e letreiro grande."
family: motion_graphics
families_mix: [motion_graphics, still_cinema]
structure: none
tags: [estoicismo, motivacional, shorts]

format:
  type: short
  aspect: "9:16"
  resolution: 1080x1920
  fps: 30
  duration: { target_s: 45, min_s: 30, max_s: 59 }

languages:
  primary: pt-BR
  outputs: [pt-BR]
  delivery: separate_videos

script:
  tone: "reflexivo, frases de impacto, uma ideia central, aplicação prática no dia a dia"
  structure: [hook_frase, ideia, exemplo, aplicacao, frase_final]
  hook_max_s: 3
  cta: "Salve para lembrar amanhã."

voice:
  chain: [gemini_tts, google_chirp3hd, qwen3_tts_local]
  voice: Orus
  style_prompt: "Voz firme e serena de mentor, ritmo pausado, peso em cada frase."
  speed: 0.98
  gap_s: 0.3

art:
  # Fontes da mídia (ADR 0004): Estátuas, pinturas e paisagens livres primeiro; IA como apoio. Alvo de IA 20%; teto 30%, o do Short (declarado, para o efetivo ser o que está escrito).
  sources: { mix: { free: 0.35, stock: 0.2, graphic: 0.15, capture: 0.05, official: 0.05, meme: 0.0, ai: 0.2 }, ai_max_share: 0.3 }
  bible: "pintura clássica a óleo, estátuas de mármore greco-romanas, templos e paisagens mediterrâneas, tons quentes, atmosfera serena e contemplativa"
  banned: ["texto", "letras", "logotipos", "marca d'água"]
  languages: [painting, render_3d]
  image_chain: [codex_cli, antigravity_cli]

edit:
  # Gramática de edição (ADR 0004): Contemplativo: zoom lento, pouco punch, sem humor.
  grammar: { punch_per_min: 1.5, slow_zoom_share: 0.45, humor: none, caption_emphasis: color }
  shot_seconds: { min: 2.2, max: 3.6 }
  camera: { ken_burns_in: 3, drift: 2, pan_up: 1, ken_burns_out: 1 }
  transitions: { cut: 5, fade_black: 2, light_leak: 1 }
  transition_seconds: 0.45
  effects:
    - { type: grade, preset: warm-soft, amount: 0.45 }
    - { type: vignette, amount: 0.35 }
    - { type: grain, amount: 0.15 }
  captions:
    style: word
    font: Cinzel
    weight: 700
    size: 86
    color: "#F7F1E3"
    highlight: "#E8B04A"
    stroke: 6
    position: center
    max_words_per_line: 2
    uppercase: true
  text_cards:
    font: Cinzel
    color: "#F7F1E3"
    accent: "#E8B04A"
    background: "#2B2118"
    animation: fade_up
  progress_bar: true
  progress_color: "#E8B04A"
  zoom_strength: 0.1

audio:
  music: { source: procedural, mood: epic, volume_db: -20, ducking: true }
  sfx: { auto: false, pack: basic }
  loudness_lufs: -14

thumbnail: { template: sem-texto, variations: 1, per_language: false }

publish:
  targets:
    - { platform: youtube, driver: youtube_native, privacy: public }
    - { platform: instagram, driver: buffer }
  ai_label: auto
