id: estoico-short
name: "Estoico / Motivacional (Short)"
description: "Reflexões curtas em 9:16 com pinturas clássicas, tipografia cinética e letreiro grande."
family: motion_graphics
families_mix: [motion_graphics, still_cinema]
structure: none
tags: [estoicismo, motivacional, shorts]

format:
  type: short
  aspect: "9:16"
  resolution: 1080x1920
  fps: 30
  duration: { target_s: 45, min_s: 30, max_s: 59 }

languages:
  primary: pt-BR
  outputs: [pt-BR]
  delivery: separate_videos

script:
  tone: "reflexivo, frases de impacto, uma ideia central, aplicação prática no dia a dia"
  structure: [hook_frase, ideia, exemplo, aplicacao, frase_final]
  hook_max_s: 3
  cta: "Salve para lembrar amanhã."

voice:
  chain: [gemini_tts, google_chirp3hd, qwen3_tts_local]
  voice: Orus
  style_prompt: "Voz firme e serena de mentor, ritmo pausado, peso em cada frase."
  speed: 0.98
  gap_s: 0.3

art:
  bible: "pintura clássica a óleo, estátuas de mármore greco-romanas, luz dourada lateral, fundo escuro, atmosfera épica e contemplativa"
  banned: ["texto", "letras", "logotipos", "marca d'água"]
  image_chain: [codex_cli, bfl_flux, fal_image, openai_image]

edit:
  shot_seconds: { min: 2.2, max: 3.6 }
  camera: { ken_burns_in: 3, drift: 2, pan_up: 1, ken_burns_out: 1 }
  transitions: { cut: 5, fade_black: 2, light_leak: 1 }
  transition_seconds: 0.45
  effects:
    - { type: grade, preset: warm-sepia, amount: 0.45 }
    - { type: vignette, amount: 0.6 }
    - { type: grain, amount: 0.25 }
  captions:
    style: word
    font: Cinzel
    weight: 700
    size: 86
    color: "#F7F1E3"
    highlight: "#E8B04A"
    stroke: 6
    position: center
    max_words_per_line: 2
    uppercase: true
  text_cards:
    font: Cinzel
    color: "#F7F1E3"
    accent: "#E8B04A"
    background: "#0A0806"
    animation: fade_up
  progress_bar: true
  progress_color: "#E8B04A"
  zoom_strength: 0.1

audio:
  music: { source: procedural, mood: epic, volume_db: -22, ducking: true }
  sfx: { auto: false, pack: basic }
  loudness_lufs: -14

thumbnail: { template: sem-texto, variations: 1, per_language: false }

publish:
  targets:
    - { platform: youtube, driver: youtube_native, privacy: public }
    - { platform: instagram, driver: buffer }
  ai_label: auto
