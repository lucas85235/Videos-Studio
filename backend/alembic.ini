# Alembic do Vulto. O app roda as migrações sozinho ao iniciar (init_db); este arquivo serve para criar
# migrações novas à mão, de dentro de backend/:
#   uv run alembic revision -m "renomeia coluna x"
#   uv run alembic current
# O banco é o mesmo do app (VS_DATA_DIR / VS_DATABASE_URL); não há URL aqui de propósito.
[alembic]
script_location = %(here)s/studio/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
